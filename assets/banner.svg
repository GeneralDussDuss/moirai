<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0d1a19"/>
      <stop offset=".55" stop-color="#07090a"/>
      <stop offset="1" stop-color="#030304"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d6538"/>
      <stop offset=".3" stop-color="#f1e2bd"/>
      <stop offset=".5" stop-color="#cfb07a"/>
      <stop offset=".72" stop-color="#8f7442"/>
      <stop offset="1" stop-color="#e8d3a2"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead0"/>
      <stop offset=".5" stop-color="#cfb07a"/>
      <stop offset="1" stop-color="#8f7442"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" x2="1">
      <stop offset="0" stop-color="#cfb07a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#cfb07a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#cfb07a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <!-- marble veins -->
  <g fill="none" stroke="#cfb07a" stroke-opacity=".10" stroke-width="1">
    <path d="M-20 80 C 200 140, 340 40, 560 120 S 900 60, 1300 160"/>
    <path d="M-20 360 C 180 300, 420 400, 640 330 S 1000 380, 1300 290"/>
    <path d="M300 -10 C 340 120, 260 260, 380 430" stroke-opacity=".06"/>
    <path d="M980 -10 C 920 140, 1040 260, 960 430" stroke-opacity=".06"/>
  </g>
  <!-- dial -->
  <g transform="translate(640 196)">
    <circle r="150" fill="none" stroke="url(#gold)" stroke-width="1.2"/>
    <circle r="143" fill="none" stroke="url(#gold)" stroke-opacity=".5" stroke-width=".6"/>
    <g stroke="#cfb07a">
      <g stroke-opacity=".9" stroke-width="1.1">
        <line x1="143" y1="0" x2="134" y2="0"/><line x1="-143" y1="0" x2="-134" y2="0"/>
        <line x1="0" y1="143" x2="0" y2="134"/><line x1="0" y1="-143" x2="0" y2="-134"/>
        <line x1="101" y1="101" x2="95" y2="95"/><line x1="-101" y1="101" x2="-95" y2="95"/>
        <line x1="101" y1="-101" x2="95" y2="-95"/><line x1="-101" y1="-101" x2="-95" y2="-95"/>
      </g>
    </g>
  </g>
  <!-- the thread: spun, measured, cut -->
  <g filter="url(#glow)" fill="none" stroke="#e3cd99" stroke-linecap="round">
    <path d="M318 262 C 400 236, 470 290, 560 262 S 720 236, 800 262 S 900 286, 942 262" stroke-width="2"/>
    <path d="M990 262 C 1010 254, 1030 270, 1060 262" stroke-width="1.2" stroke-opacity=".45"/>
  </g>
  <!-- spindle -->
  <g transform="translate(300 262)" fill="none" stroke="#e3cd99" stroke-width="1.4" stroke-linecap="round">
    <line x1="0" y1="-46" x2="0" y2="40"/>
    <ellipse cx="0" cy="22" rx="16" ry="5"/>
    <path d="M0 -36 c10 4 10 9 0 12 s-10 8 0 12 s10 8 0 12" stroke-width="1.1"/>
  </g>
  <!-- shears -->
  <g transform="translate(966 262)" fill="none" stroke="#e3cd99" stroke-width="1.6" stroke-linecap="round">
    <g transform="rotate(-18)"><line x1="-30" y1="0" x2="30" y2="0"/><circle cx="41" cy="0" r="9"/></g>
    <g transform="rotate(18)"><line x1="-30" y1="0" x2="30" y2="0"/><circle cx="41" cy="0" r="9"/></g>
    <circle r="2.4" fill="#f1e2bd" stroke="none"/>
  </g>
  <!-- wordmark -->
  <text x="640" y="206" text-anchor="middle" font-family="Didot, 'Bodoni 72', 'Bodoni Moda', 'Playfair Display', Georgia, serif" font-size="92" letter-spacing="26" fill="url(#type)">MOIRAI</text>
  <rect x="440" y="360" width="400" height="1" fill="url(#pin)"/>
  <text x="640" y="392" text-anchor="middle" font-family="'Futura', 'Jost', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="7" fill="#9c978c">THE FATES FOR CLAUDE CODE  ·  SPIN · MEASURE · CUT · TRUTH · GUARD</text>
  <!-- champagne motes -->
  <g fill="#f1e2bd">
    <circle cx="140" cy="300" r="1.2" opacity=".6"/><circle cx="210" cy="120" r=".8" opacity=".5"/><circle cx="420" cy="330" r="1" opacity=".4"/>
    <circle cx="860" cy="90" r="1.3" opacity=".6"/><circle cx="1090" cy="320" r=".9" opacity=".5"/><circle cx="1180" cy="140" r="1.1" opacity=".5"/>
    <circle cx="760" cy="350" r=".7" opacity=".4"/><circle cx="520" cy="70" r=".9" opacity=".45"/>
    <circle cx="1000" cy="60" r="4" opacity=".06"/><circle cx="240" cy="230" r="5" opacity=".05"/>
  </g>
</svg>
